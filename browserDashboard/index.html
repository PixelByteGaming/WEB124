<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Browser Info Dashboard</title>
        <script src="dashboard.js" defer></script>
    </head>

    <body>
        <h1>Browser Info Dashboard</h1>

        <p>Enter your name and favorite website to view information about your browser and website.</p>

        <form id="dashboardForm">
            <label for="userName">Name:</label>
            <input type="text" id="userName" name="userName" required>

            <br><br>

            <label for="favoriteSite">Favorite Website:</label>
            <input type="text" id="favoriteSite" name="favoriteSite"
                placeholder="https://www.google.com" required>

            <br><br>

            <button type="submit">Submit</button>
        </form>

        <section id="output"></section>
    </body>
</html>

<!DOCTYPE html>
<!--  	@author Dylan Gregory
		@date   9-7-2026 -->

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Pet Gallery</title>
		<!--Insert the external CSS here-->
		<link rel="stylesheet" href="style.css">
		<script src="cardCreator.js" defer></script>
	
	</head>
	<body>

		<h1 id="galleryHeading">Pet Gallery</h1>

		<div class="galleryContainer">
			<img id="PetImage" src="" alt="Pet image">

			<dl class="petDetails">
				<dt>Name:</dt>
				<dd id="petName"></dd>

				<!--Finish the <dt> and <dd> tags for the Details, Owner, Owner Phone, petID-->
				<dt>Details:</dt>
				<dd id="petDetails"></dd>
				<dt>Owner:</dt>
				<dd id="petOwner"></dd>
				<dt>Owner Phone:</dt>
				<dd id="ownerPhone"></dd>
				<dt>ID:</dt>
				<dd id="petID"></dd>
			</dl>
		</div>

		<div class="buttons">
			<button id="prev">Previous</button>
			<button id="next">Next</button>
		</div>

	</body>
</html>
